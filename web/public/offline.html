<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>XDrop — offline</title>
<style>
  /* Deliberately fully inline and self-contained: this file is cached
     verbatim by the service worker as the offline fallback (see
     public/sw.js), so unlike the real app shell it must never depend on
     Next's content-hashed CSS/JS chunk URLs — those filenames change on
     every rebuild and would eventually 404 out from under a stale cache
     entry, exactly the bug this file replaces. */
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0a0c;
    color: #f4f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 1.5rem;
  }
  .box { max-width: 320px; }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  p { color: #9a9aa6; font-size: 0.9rem; margin: 0 0 1.25rem; }
  button {
    padding: 0.7rem 1.4rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #5b7cfa, #a855f7);
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>XDrop needs a connection</h1>
    <p>You're offline, or the connection dropped mid-request. Resolving and downloading videos needs a live connection — reconnect and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
